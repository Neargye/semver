name: ubuntu

on: [push, pull_request]

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        compiler:
        - { name: "GCC 13",   cc: "gcc-13",   cxx: "g++-13",     os: "ubuntu-24.04" }
        - { name: "GCC 14",   cc: "gcc-14",   cxx: "g++-14",     os: "ubuntu-24.04" }
        - { name: "GCC 15",   cc: "gcc-15",   cxx: "g++-15",     os: "ubuntu-24.04" }
        - { name: "Clang 17", cc: "clang-17", cxx: "clang++-17", os: "ubuntu-24.04" }
        - { name: "Clang 18", cc: "clang-18", cxx: "clang++-18", os: "ubuntu-24.04" }
        - { name: "Clang 19", cc: "clang-19", cxx: "clang++-19", os: "ubuntu-24.04" }
        - { name: "Clang 20", cc: "clang-20", cxx: "clang++-20", os: "ubuntu-24.04" }
        - { name: "Clang 21", cc: "clang-21", cxx: "clang++-21", os: "ubuntu-24.04" }
        - { name: "Clang 22", cc: "clang-22", cxx: "clang++-22", os: "ubuntu-24.04" }

    name: "${{ matrix.compiler.name }}"
    runs-on: ${{ matrix.compiler.os }}

    env:
      CC: ${{ matrix.compiler.cc }}
      CXX: ${{ matrix.compiler.cxx }}

    steps:
    - uses: actions/checkout@v7

    - name: Install Clang
      if: ${{ startsWith(matrix.compiler.cc, 'clang') }}
      run: |
        wget -qO - https://apt.llvm.org/llvm-snapshot.gpg.key | gpg --dearmor | sudo tee /etc/apt/keyrings/llvm-archive-keyring.gpg > /dev/null
        codename="$(lsb_release -cs)"
        version="${{ matrix.compiler.cc }}"
        version="${version#clang-}"
        echo "deb [signed-by=/etc/apt/keyrings/llvm-archive-keyring.gpg] http://apt.llvm.org/${codename}/ llvm-toolchain-${codename}-${version} main" | sudo tee /etc/apt/sources.list.d/llvm.list
        sudo apt update
        sudo apt install -y "${{ matrix.compiler.cc }}"

    - name: Install GCC
      if: ${{ startsWith(matrix.compiler.cc, 'gcc') }}
      run: |
        sudo add-apt-repository ppa:ubuntu-toolchain-r/test -y
        sudo apt update
        sudo apt install -y "${{ matrix.compiler.cxx }}"

    - name: Configure Release
      run: cmake -S . -B build-release -DCMAKE_BUILD_TYPE=Release

    - name: Build Release
      run: cmake --build build-release --parallel --config Release

    - name: Test Release
      run: ctest --test-dir build-release --output-on-failure -C Release

    - name: Configure Debug
      run: cmake -S . -B build-debug -DCMAKE_BUILD_TYPE=Debug

    - name: Build Debug
      run: cmake --build build-debug --parallel --config Debug

    - name: Test Debug
      run: ctest --test-dir build-debug --output-on-failure -C Debug

  sanitizers:
    name: "Clang 20 / ASan + UBSan"
    runs-on: ubuntu-24.04

    env:
      CC: clang-20
      CXX: clang++-20
      ASAN_OPTIONS: detect_leaks=1
      UBSAN_OPTIONS: print_stacktrace=1

    steps:
    - uses: actions/checkout@v7

    - name: Install Clang 20
      run: |
        wget -qO - https://apt.llvm.org/llvm-snapshot.gpg.key | gpg --dearmor | sudo tee /etc/apt/keyrings/llvm-archive-keyring.gpg > /dev/null
        codename="$(lsb_release -cs)"
        echo "deb [signed-by=/etc/apt/keyrings/llvm-archive-keyring.gpg] http://apt.llvm.org/${codename}/ llvm-toolchain-${codename}-20 main" | sudo tee /etc/apt/sources.list.d/llvm.list
        sudo apt update
        sudo apt install -y clang-20

    - name: Configure
      run: >-
        cmake -S . -B build-sanitizers
        -DCMAKE_BUILD_TYPE=Debug
        -DSEMVER_OPT_BUILD_EXAMPLES=OFF
        -DSEMVER_OPT_BUILD_TESTS=ON
        -DSEMVER_OPT_INSTALL=OFF
        -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer"
        -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"

    - name: Build
      run: cmake --build build-sanitizers --parallel

    - name: Test
      run: ctest --test-dir build-sanitizers --output-on-failure
